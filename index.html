function levelFromXP(x){return x<10?1:x<25?2:3}
const LEVELS={1:"Exploradora",2:"Aventurera",3:"Guardiana"};let st=null,chosen=0;
function home(){st=null;const d=load(),stars=Object.values(d.best).reduce((a,b)=>a+b,0),lv=levelFromXP(d.xp),next=lv===1?10:lv===2?25:25,base=lv===1?0:lv===2?10:25,pct=lv===3?100:Math.round((d.xp-base)/(next-base)*100);$("#app").innerHTML=`<h1>Las cuatro islas</h1><p class="sub">Aprende jugando, gana estrellas y desbloquea nuevas aventuras.</p><div class="summary"><span class="pill">⭐ ${stars}/20</span><span class="pill">✨ ${d.xp} puntos</span><span class="pill">🔥 ${d.streak} días</span><button class="soft" id="tr">🏆 Trofeos</button></div><div class="panel"><b>Nivel ${lv}: ${LEVELS[lv]}</b><div class="bar" aria-label="Progreso de nivel"><span style="width:${pct}%"></span></div><small>${lv===3?"¡Nivel máximo conseguido!":`${next-d.xp} puntos para el siguiente nivel`}</small></div><div class="map">${Object.entries(AREAS).map(([k,a])=>{let open=unlocked(k,d),need=Math.max(0,a.unlock-d.xp);return `<button class="isl" data-a="${k}" style="--c:${a.c}" ${open?"":"disabled"}><span class="em">${open?a.e:"🔒"}</span><span>${a.n}<small>${a.d}</small></span><span>${"⭐".repeat(d.best[k]||0)}${"☆".repeat(5-(d.best[k]||0))}</span>${open?"":`<span class="lock">Faltan ${need} puntos</span>`}</button>`}).join("")}</div>`;document.querySelectorAll(".isl:not(:disabled)").forEach(b=>b.onclick=()=>choose(b.dataset.a));$("#tr").onclick=trophies}
function choose(a){const d=load(),auto=levelFromXP(d.xp);chosen=auto;const A=AREAS[a];$("#app").innerHTML=`<div style="--c:${A.c}"><button class="back" id="bk">← Islas</button><div class="panel" style="text-align:center"><div class="em">${A.e}</div><h1>${A.n}</h1><p>Elige la dificultad. Recomendamos el nivel ${auto}.</p><div class="levelrow">${[1,2,3].map(n=>`<button class="level ${n===auto?"sel":""}" data-n="${n}">${n}. ${LEVELS[n]}</button>`).join("")}</div><button class="next" id="go">Empezar</button></div></div>`;$("#bk").onclick=home;document.querySelectorAll(".level").forEach(b=>b.onclick=()=>{chosen=+b.dataset.n;document.querySelectorAll(".level").forEach(x=>x.classList.toggle("sel",x===b))});$("#go").onclick=()=>start(a,chosen)}
function start(a,n){let pool=a==="mates"?[]:BANK[a].filter(q=>q.n===n);if(pool.length<5&&a!=="mates")pool=BANK[a].filter(q=>Math.abs(q.n-n)<=1);const qs=a==="mates"?Array.from({length:5},()=>M(n)):shuf(pool).slice(0,5);st={a,n,qs,i:0,s:0,topics:{}};show()}
function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function show(){const A=AREAS[st.a],q=st.qs[st.i],opts=shuf([{t:q.r,ok:1},...q.w.map(t=>({t,ok:0}))]);$("#app").innerHTML=`<div style="--c:${A.c}"><div class="top"><button class="back" id="bk">← Islas</button><div class="dots" aria-label="Pregunta ${st.i+1} de 5">${st.qs.map((_,i)=>`<i class="${i<st.i?"on":""}${i===st.i?" cur":""}"></i>`).join("")}</div></div><div class="q"><span class="tag">Nivel ${st.n} · ${LEVELS[st.n]}</span><div class="em">${q.e}</div><h2>${q.q}</h2>${q.say?'<button class="snd" id="sn">🔊 Escuchar</button>':""}</div><div class="opts">${opts.map(o=>`<button class="opt" data-ok="${o.ok}">${o.t}</button>`).join("")}</div><div id="fb" aria-live="polite"></div></div>`;$("#bk").onclick=home;if(q.say)$("#sn").onclick=()=>speak(q.say);document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,q))}
function answer(b,q){const ok=b.dataset.ok==="1";document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.ok==="1")x.classList.add("ok")});if(ok){st.s++;st.topics[q.topic]=(st.topics[q.topic]||0)+1}else b.classList.add("no");const last=st.i===4;$("#fb").innerHTML=(ok?["¡Muy bien!","¡Perfecto!","¡Genial!"][rnd(0,2)]+" 🎉":"Casi. La respuesta es: "+q.r)+`<br><button class="next" id="nx">${last?"Ver mi premio":"Siguiente"}</button>`;$("#nx").focus();$("#nx").onclick=()=>last?end():(st.i++,show())}
function end(){const d=load(),today=day(),old=d.best[st.a]||0;d.best[st.a]=Math.max(old,st.s);d.games++;if(st.s===5)d.perfect++;const gain=Math.max(1,st.s)+(st.s===5?2:0);d.xp+=gain;if(d.last!==today){d.streak=d.last&&diffDays(d.last,today)===1?d.streak+1:1;d.last=today}Object.entries(st.topics).forEach(([k,v])=>d.topics[k]=(d.topics[k]||0)+v);const checks=[['first','🌟','Primera aventura',d.games>=1],['perfect','👑','Cinco de cinco',d.perfect>=1],['streak3','🔥','Racha de 3 días',d.streak>=3],['house','🏠','Experta en la casa',(d.topics.house||0)>=8],['ten','💫','10 puntos',d.xp>=10],['all','🗺️','Todas las islas',Object.keys(d.best).length===4],['body','🧍','Experta en el cuerpo',(d.topics.body||0)+(d.topics.cuerpo||0)>=10],['family','👨‍👩‍👧‍👦','Experta en la familia',(d.topics.family||0)+(d.topics.familia||0)>=8],['school','🏫','Experta en el colegio',(d.topics.school||0)+(d.topics.colegio||0)>=8]];let fresh=[];checks.forEach(x=>{if(x[3]&&!d.badges.includes(x[0])){d.badges.push(x[0]);fresh.push(x)}});save(d);const A=AREAS[st.a],msg=st.s===5?"¡Perfecto! Eres una campeona":st.s>=3?"¡Muy bien! Sigue explorando":"¡Buen intento! Cada partida te hace aprender";$("#app").innerHTML=`<div class="end" style="--c:${A.c}"><h1>${A.e} ${A.n}</h1><div class="stars">${"⭐".repeat(st.s)}${"☆".repeat(5-st.s)}</div><p class="sub">${msg}</p><div class="notice">Has ganado ${gain} puntos ✨${st.s===5?" (incluye premio perfecto)":""}</div>${fresh.map(x=>`<div class="notice">¡Nuevo trofeo! ${x[1]} ${x[2]}</div>`).join("")}<button class="next" id="ag">Jugar otra vez</button> <button class="back" id="hm">Volver a las islas</button></div>`;$("#ag").onclick=()=>start(st.a,st.n);$("#hm").onclick=home}
function trophies(){const d=load(),all=[['first','🌟','Primera aventura','Completa una partida'],['perfect','👑','Cinco de cinco','Acierta las 5 preguntas'],['streak3','🔥','Racha de 3 días','Juega tres días seguidos'],['house','🏠','Experta en la casa','Acierta 8 preguntas de la casa'],['ten','💫','10 puntos','Consigue 10 puntos'],['all','🗺️','Todas las islas','Juega en las cuatro islas'],['body','🧍','Experta en el cuerpo','Acierta 10 preguntas del cuerpo'],['family','👨‍👩‍👧‍👦','Experta en la familia','Acierta 8 preguntas de la familia'],['school','🏫','Experta en el colegio','Acierta 8 preguntas del colegio']];$("#app").innerHTML=`<button class="back" id="bk">← Islas</button><h1>Mis trofeos</h1><p class="sub">Los premios celebran el esfuerzo. Nunca se pierden.</p><div class="badgegrid">${all.map(x=>`<div class="badge ${d.badges.includes(x[0])?"":"off"}"><span class="em">${x[1]}</span><b>${x[2]}</b><small>${d.badges.includes(x[0])?"¡Conseguido!":x[3]}</small></div>`).join("")}</div><div class="panel"><b>Progreso guardado en este dispositivo</b><p>Partidas: ${d.games} · Perfectas: ${d.perfect} · Racha: ${d.streak}</p><button class="soft" id="reset">Reiniciar progreso</button></div>`;$("#bk").onclick=home;$("#reset").onclick=()=>{if(confirm("¿Seguro que quieres borrar estrellas y trofeos?")){localStorage.removeItem("islas2");home()}}}
home();
</script></body></html>
