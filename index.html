function videos(){
 $("#app").innerHTML=`<button class="back" id="bk">← Islas</button><h1>📺 Vídeos de clase</h1>${VID.map(g=>`<div class="panel"><h2>${g[0]} ${g[1]}</h2><small>${g[2]}</small>${g[3].map(v=>`<div class="notice">${v[0]}<br><a class="soft" href="${YT(v[1])}" target="_blank" rel="noopener noreferrer">▶ Ver vídeo</a></div>`).join("")}</div>`).join("")}`;
 $("#bk").onclick=home;
}

function home(){
 st=null;const d=load(),L=lvOf(d.xp),stars=Object.values(d.best).reduce((a,b)=>a+b,0),base=TH[L-1],nx=TH[L],pct=L===5?100:Math.round((d.xp-base)/(nx-base)*100),np=PR.filter(p=>d.badges.includes(p[0])).length;
 $("#app").innerHTML=`<h1>Las cinco islas</h1><p class="sub">Aprende jugando, sube de nivel y reúne a todas las princesas del reino.</p><div class="summary"><span class="pill">⭐ ${stars}/25</span><span class="pill">✨ ${d.xp} puntos</span><span class="pill">🔥 ${d.streak} días</span><span class="pill" id="rem">⏳ ${rem()} min</span><button class="soft" id="tr">👸 Mi reino ${np}/${PR.length}</button></div><div class="panel"><b>Nivel ${L}: ${LV[L-1]}</b><div class="bar" aria-label="Progreso de nivel"><span style="width:${pct}%"></span></div><small>${L===5?"¡Eres la reina sabia del reino!":`${nx-d.xp} puntos para el nivel ${L+1}`}</small></div><div class="map">${Object.entries(AREAS).map(([k,a])=>{const open=unlocked(k,d),need=Math.max(0,a.unlock-d.xp);return `<button class="isl" data-a="${k}" style="--c:${a.c}" ${open?"":"disabled"}><span class="em">${open?a.e:"🔒"}</span><span>${a.n}<small>${a.d}</small></span><span>${"⭐".repeat(d.best[k]||0)}${"☆".repeat(5-(d.best[k]||0))}</span>${open?"":`<span class="lock">Faltan ${need} puntos</span>`}</button>`}).join("")}</div><button class="soft" id="vd" style="width:100%;margin-top:14px;font-size:1.1rem;padding:12px">📺 Vídeos de clase</button>`;
 document.querySelectorAll(".isl:not(:disabled)").forEach(b=>b.onclick=()=>choose(b.dataset.a));$("#tr").onclick=reino;$("#vd").onclick=videos;
}
function choose(a){
 const D0=load(),L=lvOf(D0.xp),A=AREAS[a];let dif=[1,1,2,2,3][L-1],u=0;
 $("#app").innerHTML=`<div style="--c:${A.c}"><button class="back" id="bk">← Islas</button><div class="panel" style="text-align:center"><div style="font-size:3rem">${A.e}</div><h1>${A.n}</h1><p>Elige la unidad de tu libro y la dificultad. Consigue 3 ⭐ en una unidad para abrir la siguiente.</p><div class="units"><button class="level sel" data-u="0">⭐ Todas las unidades</button>${UN[a].map((t,i)=>{const k=i+1,op=unitOpen(D0,a,k),b=D0.ub[a+k]||0;return `<button class="level" data-u="${k}" ${op?"":"disabled"}>${op?"":"🔒 "}${k}. ${t}${b?" "+"⭐".repeat(b):""}</button>`}).join("")}</div><div class="levelrow">${DF.map((x,i)=>`<button class="level ${dif===i+1?"sel":""}" data-d="${i+1}">${x}</button>`).join("")}</div><button class="next" id="go">Empezar</button></div></div>`;
 $("#bk").onclick=home;
 document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{u=+b.dataset.u;document.querySelectorAll("[data-u]").forEach(x=>x.classList.toggle("sel",x===b))});
 document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{dif=+b.dataset.d;document.querySelectorAll("[data-d]").forEach(x=>x.classList.toggle("sel",x===b))});
 $("#go").onclick=()=>start(a,dif,u);
}
function start(a,n,u){const dd=load();AL=new Set(UN[a].map((_,i)=>i+1).filter(k=>unitOpen(dd,a,k)));st={a,n,u,qs:Array.from({length:5},()=>draw(a,n,u)),i:0,s:0,topics:{}};show()}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function show(){
 const A=AREAS[st.a],q=st.qs[st.i],opts=shuf([{t:q.r,ok:1},...q.w.map(t=>({t,ok:0}))]);
 $("#app").innerHTML=`<div style="--c:${A.c}"><div class="top"><button class="back" id="bk">← Islas</button><div class="dots" aria-label="Pregunta ${st.i+1} de 5">${st.qs.map((_,i)=>`<i class="${i<st.i?"on":""}${i===st.i?" cur":""}"></i>`).join("")}</div></div><div class="q"><span class="tag">${DF[st.n-1]} · ${st.u?"Unidad "+st.u:"Todas las unidades"}</span><div class="em">${q.e}</div><h2>${q.q}</h2>${q.say?'<button class="snd" id="sn">🔊 Escuchar</button>':""}</div><div class="opts">${opts.map(o=>`<button class="opt" data-ok="${o.ok}">${o.t}</button>`).join("")}</div><div id="fb" aria-live="polite"></div></div>`;
 $("#bk").onclick=home;if(q.say)$("#sn").onclick=()=>speak(q.say);
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,q));
}
function answer(b,q){
 const ok=b.dataset.ok==="1",last=st.i===4;
 document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.ok==="1")x.classList.add("ok")});
 if(ok){st.s++;st.topics[q.topic]=(st.topics[q.topic]||0)+1}else b.classList.add("no");
 $("#fb").innerHTML=(ok?pick(["¡Muy bien!","¡Perfecto!","¡Genial!"])+" 🎉":"Casi. La respuesta es: "+q.r)+`<br><button class="next" id="nx">${last?"Ver mi premio":"Siguiente"}</button>`;
 $("#nx").focus();$("#nx").onclick=()=>last?end():(st.i++,show());
}
function end(){
 const d=load(),today=day(),L0=lvOf(d.xp);
 d.best[st.a]=Math.max(d.best[st.a]||0,st.s);d.games++;if(st.s===5)d.perfect++;
 const gain=Math.max(1,st.s)+(st.s===5?2:0)+(st.s>=3?st.n-1:0);d.xp+=gain;
 if(d.last!==today){d.streak=d.last&&diffDays(d.last,today)===1?d.streak+1:1;d.last=today}
 Object.entries(st.topics).forEach(([k,v])=>d.topics[k]=(d.topics[k]||0)+v);
 d.areaOk[st.a]=(d.areaOk[st.a]||0)+st.s;let nu=null;if(st.u){const k=st.a+st.u,old=d.ub[k]||0;d.ub[k]=Math.max(old,st.s);if(st.s>=3&&old<3&&st.u<UN[st.a].length)nu=UN[st.a][st.u]}
 const fresh=PR.filter(p=>!d.badges.includes(p[0])&&p[4](d));fresh.forEach(p=>d.badges.push(p[0]));save(d);
 const A=AREAS[st.a],L1=lvOf(d.xp),msg=st.s===5?"¡Perfecto! Eres una campeona":st.s>=3?"¡Muy bien! Sigue explorando":"¡Buen intento! Cada partida te hace aprender";
 $("#app").innerHTML=`<div class="end" style="--c:${A.c}"><h1>${A.e} ${A.n}</h1><div class="stars">${"⭐".repeat(st.s)}${"☆".repeat(5-st.s)}</div><p class="sub">${msg}</p><div class="notice">Has ganado ${gain} puntos ✨</div>${nu?`<div class="notice">🔓 ¡Nueva unidad desbloqueada: ${nu}!</div>`:""}${L1>L0?`<div class="notice">¡Subes al nivel ${L1}: ${LV[L1-1]}! 🎊</div>`:""}${fresh.map(p=>`<div class="notice pr">${prin(p)}<br>¡Nueva princesa! <b>${p[2]}</b> se une a tu reino</div>`).join("")}<button class="next" id="ag">Jugar otra vez</button> <button class="back" id="hm">Volver a las islas</button></div>`;
 $("#ag").onclick=()=>start(st.a,st.n,st.u);$("#hm").onclick=home;
}
function reino(){
 const d=load();
 $("#app").innerHTML=`<button class="back" id="bk">← Islas</button><h1>Mi reino</h1><p class="sub">Cada princesa llega al reino cuando consigues un reto. ¡Reúnelas a todas!</p><div class="badgegrid">${PR.map(p=>{const on=d.badges.includes(p[0]);return `<div class="badge ${on?"":"off"}">${on?prin(p):'<span class="em">❔</span>'}<b>${on?p[2]:"Princesa misteriosa"}</b><small>${on?"¡Conseguida!":p[3]}</small></div>`}).join("")}</div><div class="panel"><b>Progreso guardado en este dispositivo</b><p>Partidas: ${d.games} · Perfectas: ${d.perfect} · Racha: ${d.streak}</p><button class="soft" id="reset">Reiniciar progreso</button></div>`;
 $("#bk").onclick=home;
 $("#reset").onclick=()=>{if(confirm("¿Seguro que quieres borrar estrellas y princesas?")){try{localStorage.removeItem("islas3")}catch(e){}home()}};
}
tm.s>=LIM?lockScreen():home();
</script></body></html>
